[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "route-arena"
version = "0.1.0"
description = "A typed, dependency-light LLM router: scores models across a cost/quality/latency Pareto frontier, with an offline eval harness and a live A/B arena."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = ["llm", "routing", "ml-infra", "pareto", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core has ZERO required runtime dependencies. Everything below is optional.
dependencies = []

[project.optional-dependencies]
pretty = ["rich>=13.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=7.0", "rich>=13.0"]

[project.scripts]
route-arena = "route_arena.cli:main"

[project.urls]
Homepage = "https://github.com/Danush-Aries/route-arena"
Repository = "https://github.com/Danush-Aries/route-arena"

[tool.setuptools.packages.find]
include = ["route_arena*"]

[tool.setuptools.package-data]
route_arena = ["eval/results.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
